<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">A month of agent work</title><desc id="d">A month of agent work, from Claude Code&#x27;s /insights report for 27 October to 26 November 2026: 107 sessions analysed of 212, 382 commits, 350 subagents started, 66 sessions run in parallel. File activity by language: Python 1,691, Markdown 1,312, Rust 775, TypeScript 230. How I work: I learn by building real things and measuring them. Agents write most of the code; the specs and the merge stay mine. When something breaks, I add a test or a hook so it cannot come back quietly. I date every benchmark and say what each tool does not stop.</desc><defs><linearGradient id="bf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="bs" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c959f" stop-opacity="0"/><stop offset="0.5" stop-color="#8c959f" stop-opacity="0.35"/><stop offset="1" stop-color="#8c959f" stop-opacity="0"/></linearGradient><radialGradient id="bg" cx="12%" cy="0%" r="75%"><stop offset="0" stop-color="#0a7c86" stop-opacity="0.13"/><stop offset="1" stop-color="#0a7c86" stop-opacity="0"/></radialGradient><clipPath id="bar"><rect x="40" y="306" width="476" height="12" rx="6"/></clipPath></defs><rect width="960" height="372" fill="#ffffff"/><rect x="0.5" y="0.5" width="959" height="371" rx="18" fill="url(#bf)" stroke="#d0d7de"/><path d="M18.5,1.25 H941.5" stroke="url(#bs)" stroke-width="1.5"/><rect x="0.5" y="0.5" width="959" height="371" rx="18" fill="url(#bg)"/><rect x="22" y="34" width="5" height="28" rx="2.5" fill="#0a7c86"/><text x="40" y="56" font-size="26" font-weight="700" fill="#1f2328" text-anchor="start">A month of agent work</text><text x="40" y="82" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">claude code /insights  ·  27 oct to 26 nov 2026</text><rect x="40.0" y="100" width="232.0" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="56" y="147" font-size="32" font-weight="700" fill="#9a6700" text-anchor="start">107</text><text x="132" y="132" font-size="15" font-weight="500" fill="#1f2328" text-anchor="start">sessions analysed</text><text x="132" y="154" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">of 212 in total</text><rect x="284.0" y="100" width="232.0" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="300" y="147" font-size="32" font-weight="700" fill="#0a7c86" text-anchor="start">382</text><text x="376" y="132" font-size="15" font-weight="500" fill="#1f2328" text-anchor="start">commits</text><text x="376" y="154" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">agents wrote most</text><rect x="40.0" y="184" width="232.0" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="56" y="231" font-size="32" font-weight="700" fill="#0a7c86" text-anchor="start">350</text><text x="132" y="216" font-size="15" font-weight="500" fill="#1f2328" text-anchor="start">subagents started</text><text x="132" y="238" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">by lead sessions</text><rect x="284.0" y="184" width="232.0" height="72" rx="10" fill="#ffffff" stroke="#d0d7de"/><text x="300" y="231" font-size="32" font-weight="700" fill="#9a6700" text-anchor="start">66</text><text x="376" y="216" font-size="15" font-weight="500" fill="#1f2328" text-anchor="start">parallel sessions</text><text x="376" y="238" font-size="13.5" font-weight="400" fill="#59636e" text-anchor="start">in 85 overlaps</text><text x="40" y="292" font-size="13" font-weight="400" fill="#59636e" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">file activity by language</text><g clip-path="url(#bar)"><rect x="40.0" y="306" width="196.3" height="12" fill="#9a6700"/><rect x="235.8" y="306" width="152.4" height="12" fill="#59636e"/><rect x="387.8" y="306" width="90.3" height="12" fill="#0a7c86"/><rect x="477.5" y="306" width="27.1" height="12" fill="#1f2328"/><rect x="504.2" y="306" width="12.3" height="12" fill="#d0d7de"/></g><circle cx="45.0" cy="339.0" r="5" fill="#9a6700"/><text x="55" y="344" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Python 1,691</text><circle cx="163.4" cy="339.0" r="5" fill="#59636e"/><text x="173.45" y="344" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Markdown 1,312</text><circle cx="304.2" cy="339.0" r="5" fill="#0a7c86"/><text x="314.16" y="344" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">Rust 775</text><circle cx="394.5" cy="339.0" r="5" fill="#1f2328"/><text x="404.52" y="344" font-size="14" font-weight="400" fill="#424a53" text-anchor="start">TypeScript 230</text><path d="M540,40 V332" stroke="#d0d7de" stroke-width="1"/><text x="568" y="56" font-size="22" font-weight="700" fill="#1f2328" text-anchor="start">How I work</text><text x="568" y="98" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">1</text><text x="594" y="98" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">I learn by building real things and</text><text x="594" y="120" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">measuring them.</text><text x="568" y="154" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">2</text><text x="594" y="154" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">Agents write most of the code; the specs</text><text x="594" y="176" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">and the merge stay mine.</text><text x="568" y="210" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">3</text><text x="594" y="210" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">When something breaks, I add a test or a</text><text x="594" y="232" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">hook so it cannot come back quietly.</text><text x="568" y="266" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">4</text><text x="594" y="266" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">I date every benchmark and say what each</text><text x="594" y="288" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">tool does not stop.</text></svg>
