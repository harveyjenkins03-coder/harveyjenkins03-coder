<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How I build: the 4D loop</title><desc id="d">Four stages, left to right: delegation, description, discernment and diligence. In each one the top row says what I do and the bottom row, inside a dashed boundary of agreed limits, says what the agents do. An arrow returns from diligence to delegation for the next change. Delegation: I decide what agents may touch and what stays mine. Agents get a written brief, short leases and hooks. Description: I write the plan, the rules and how we will check it. Agents write the code and the tests. Discernment: I read the findings and make the call. Tests, benchmarks and a separate reviewer agent. Diligence: I approve the change, and every number gets a date. Gates before merge, and the limits written down.</desc><rect width="960" height="470" fill="#0d1117"/><rect x="0.5" y="0.5" width="959" height="469" rx="12" fill="#161b22" stroke="#30363d"/><text x="28" y="46" font-size="24" font-weight="700" fill="#e6edf3" text-anchor="start">How I build</text><text x="180.595" y="46" font-size="17" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">the 4D loop</text><text x="28" y="142" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">Me</text><text x="28" y="164" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">direction</text><text x="28" y="184" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">sign-off</text><rect x="110" y="236" width="826" height="146" rx="10" fill="none" stroke="#3d444d" stroke-width="1.5" stroke-dasharray="6 5"/><text x="28" y="280" font-size="16" font-weight="600" fill="#e6edf3" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">Agents</text><text x="28" y="302" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">inside the</text><text x="28" y="322" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">agreed</text><text x="28" y="342" font-size="12" font-weight="400" fill="#9198a1" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">limits</text><rect x="118.0" y="78" width="189.5" height="44" rx="8" fill="#0d1117" stroke="#e09f3e" stroke-width="1.5"/><text x="130" y="106" font-size="15" font-weight="700" fill="#e09f3e" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">1</text><text x="150" y="106" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Delegation</text><text x="124" y="148" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">I decide what agents</text><text x="124" y="169" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">may touch and what</text><text x="124" y="190" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">stays mine.</text><text x="124" y="266" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Agents get a written</text><text x="124" y="287" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">brief, short leases and</text><text x="124" y="308" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">hooks.</text><path d="M311.5,100 H323.5" stroke="#9198a1" stroke-width="1.6"/><path d="M323.5,95 L329.5,100 L323.5,105 Z" fill="#9198a1"/><rect x="327.5" y="78" width="189.5" height="44" rx="8" fill="#0d1117" stroke="#39c5cf" stroke-width="1.5"/><text x="339.5" y="106" font-size="15" font-weight="700" fill="#39c5cf" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">2</text><text x="359.5" y="106" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Description</text><text x="333.5" y="148" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">I write the plan, the rules</text><text x="333.5" y="169" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">and how we will check it.</text><text x="333.5" y="266" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Agents write the code</text><text x="333.5" y="287" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">and the tests.</text><path d="M521.0,100 H533.0" stroke="#9198a1" stroke-width="1.6"/><path d="M533.0,95 L539.0,100 L533.0,105 Z" fill="#9198a1"/><rect x="537.0" y="78" width="189.5" height="44" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/><text x="549" y="106" font-size="15" font-weight="700" fill="#3fb950" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">3</text><text x="569" y="106" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Discernment</text><text x="543" y="148" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">I read the findings and</text><text x="543" y="169" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">make the call.</text><text x="543" y="266" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Tests, benchmarks and</text><text x="543" y="287" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">a separate reviewer</text><text x="543" y="308" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">agent.</text><path d="M730.5,100 H742.5" stroke="#9198a1" stroke-width="1.6"/><path d="M742.5,95 L748.5,100 L742.5,105 Z" fill="#9198a1"/><rect x="746.5" y="78" width="189.5" height="44" rx="8" fill="#0d1117" stroke="#a371f7" stroke-width="1.5"/><text x="758.5" y="106" font-size="15" font-weight="700" fill="#a371f7" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">4</text><text x="778.5" y="106" font-size="17" font-weight="600" fill="#e6edf3" text-anchor="start">Diligence</text><text x="752.5" y="148" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">I approve the change,</text><text x="752.5" y="169" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">and every number gets a</text><text x="752.5" y="190" font-size="15" font-weight="400" fill="#e6edf3" text-anchor="start">date.</text><text x="752.5" y="266" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">Gates before merge, and</text><text x="752.5" y="287" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">the limits written down.</text><path d="M841.2,382 V420 H212.8 V390" fill="none" stroke="#e09f3e" stroke-width="1.6" stroke-dasharray="4 4"/><path d="M207.8,394 L212.8,384 L217.8,394 Z" fill="#e09f3e"/><text x="527" y="414" font-size="14" font-weight="400" fill="#9198a1" text-anchor="middle">what one change teaches goes into the next brief</text><text x="28" y="452" font-size="14" font-weight="400" fill="#9198a1" text-anchor="start">Delegation, description, discernment, diligence: the 4D framework from Anthropic&#x27;s AI Fluency course.</text></svg>
