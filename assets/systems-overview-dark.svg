<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Three measured systems</title><desc id="d">A 60 Hz fixed-point Rust simulation whose server tick p99 is 361 microseconds against an 8,000 microsecond budget; a read-first Rust and Tauri 2 dashboard that uses 7.9 MB of private memory in the tray with no web view and no GPU; and 240 tests across three MIT Python tools.</desc><defs><pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><rect x="7" y="7" width="2" height="2" fill="#262c34"/></pattern><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7480"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e09f3e"/></marker></defs><rect x="1" y="1" width="1198" height="328" rx="12" fill="#181b20" stroke="#323a44" stroke-width="1.5"/><rect x="1" y="1" width="1198" height="328" rx="12" fill="url(#dots)"/><rect x="24" y="24" width="368" height="282" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="46" y="58" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">60 Hz fixed-point Rust simulation</text><text x="46" y="112" font-size="40" font-weight="600" fill="#e09f3e" text-anchor="start">361 µs</text><text x="46" y="138" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">p99 server tick, 100 enemies</text><rect x="46" y="158" width="324" height="10" rx="5.0" fill="#2a3038"/><rect x="46" y="158" width="14.6" height="10" rx="5.0" fill="#e09f3e"/><text x="46" y="190" font-size="12" font-weight="400" fill="#a7afb8" text-anchor="start">of the 8,000 µs budget for one tick</text><path d="M46,212 L370,212" fill="none" stroke="#6b7480" stroke-width="1.6"/><text x="46" y="240" font-size="13" font-weight="400" fill="#ece4d6" text-anchor="start">Windows and Linux state dumps</text><text x="46" y="262" font-size="13" font-weight="400" fill="#ece4d6" text-anchor="start">identical over 14,397 lines</text><rect x="416" y="24" width="368" height="282" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="438" y="58" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Read-first Rust and Tauri 2 hub</text><text x="438" y="112" font-size="40" font-weight="600" fill="#e09f3e" text-anchor="start">7.9 MB</text><text x="438" y="138" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">private memory, closed to the tray</text><rect x="438" y="158" width="324" height="10" rx="5.0" fill="#2a3038"/><rect x="438" y="158" width="170.6" height="10" rx="5.0" fill="#e09f3e"/><text x="438" y="190" font-size="12" font-weight="400" fill="#a7afb8" text-anchor="start">of the 15 MB budget</text><path d="M438,212 L762,212" fill="none" stroke="#6b7480" stroke-width="1.6"/><text x="438" y="240" font-size="13" font-weight="400" fill="#ece4d6" text-anchor="start">0 web views and 0% GPU in the tray</text><text x="438" y="262" font-size="13" font-weight="400" fill="#ece4d6" text-anchor="start">1 audited write path</text><rect x="808" y="24" width="368" height="282" rx="8" fill="#1f242b" stroke="#323a44" stroke-width="1"/><text x="830" y="58" font-size="15" font-weight="600" fill="#ece4d6" text-anchor="start">Agent tooling, MIT</text><text x="830" y="112" font-size="40" font-weight="600" fill="#e09f3e" text-anchor="start">240 tests</text><text x="830" y="138" font-size="13" font-weight="400" fill="#a7afb8" text-anchor="start">across three Python repositories</text><rect x="830.0" y="158" width="173.8" height="10" rx="3" fill="#e09f3e"/><text x="830" y="186" font-size="12" font-weight="400" fill="#a7afb8" text-anchor="start">131 workflow</text><rect x="1006.9" y="158" width="99.6" height="10" rx="3" fill="#6b7480"/><text x="1006.85" y="186" font-size="12" font-weight="400" fill="#a7afb8" text-anchor="start">76 broker</text><rect x="1109.5" y="158" width="41.5" height="10" rx="3" fill="#a7afb8"/><text x="1154" y="186" font-size="12" font-weight="400" fill="#a7afb8" text-anchor="end">33 shield</text><path d="M830,212 L1154,212" fill="none" stroke="#6b7480" stroke-width="1.6"/><text x="830" y="240" font-size="13" font-weight="400" fill="#ece4d6" text-anchor="start">standard-library Python</text><text x="830" y="262" font-size="13" font-weight="400" fill="#ece4d6" text-anchor="start">tests run in CI on Linux and Windows</text></svg>
