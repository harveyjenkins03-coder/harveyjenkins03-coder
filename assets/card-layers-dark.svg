<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 324" width="412" height="324" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">OS layer, systems and desktop</title><desc id="d">OS layer, systems and desktop. An OS-layer design on Ubuntu with a Hyper-V milestone and a prototype job scheduler. A 60 Hz fixed-point Rust engine that agrees across Windows and Linux, and a Tauri desktop hub. Tools: rust, linux, tauri 2.</desc><defs><linearGradient id="c3f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#161b22"/></linearGradient><linearGradient id="c3s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="c3g" cx="12%" cy="0%" r="75%"><stop offset="0" stop-color="#e09f3e" stop-opacity="0.13"/><stop offset="1" stop-color="#e09f3e" stop-opacity="0"/></radialGradient></defs><rect width="412" height="324" fill="#0d1117"/><g transform="translate(4,4)"><rect x="0.5" y="0.5" width="403" height="315" rx="14" fill="url(#c3f)" stroke="#30363d"/><path d="M14.5,1.25 H389.5" stroke="url(#c3s)" stroke-width="1.5"/><rect x="0.5" y="0.5" width="403" height="315" rx="14" fill="url(#c3g)"/><circle cx="50" cy="52" r="26" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><path d="M50,50.56 L64.4,57.76 L50,64.96 L35.6,57.76 Z" fill="none" stroke="#e09f3e" stroke-width="1.872" stroke-linejoin="round"/><path d="M50,44.8 L64.4,52 L50,59.2 L35.6,52 Z" fill="none" stroke="#e09f3e" stroke-width="1.872" stroke-linejoin="round"/><path d="M50,39.04 L64.4,46.24 L50,53.44 L35.6,46.24 Z" fill="#e09f3e" stroke="#e09f3e" stroke-width="1.872" stroke-linejoin="round"/><text x="24" y="112" font-size="21" font-weight="650" fill="#f0f6fc" text-anchor="start">OS layer, systems and desktop</t