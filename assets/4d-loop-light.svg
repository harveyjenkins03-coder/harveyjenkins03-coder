<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">How I build: the 4D loop</title><desc id="d">Four stages, left to right, with what I do and what the agents do in each. Delegation: me, decide what agents may touch. Agents: get a brief, short leases and hooks. Description: me, write the plan, rules and checks. Agents: write the code and the tests. Discernment: me, read the findings and decide. Agents: run tests, benchmarks, a second review. Diligence: me, approve, and date every number. Agents: pass the gates; limits go in writing. The loop then returns to delegation for the next change.</desc><defs><linearGradient id="lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="ls" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c959f" stop-opacity="0"/><stop offset="0.5" stop-color="#8c959f" stop-opacity="0.35"/><stop offset="1" stop-color="#8c959f" stop-opacity="0"/></linearGradient><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/></marker></defs><rect width="760" height="392" fill="#ffffff"/><rect x="0.5" y="0.5" width="759" height="391" rx="14" fill="url(#lf)" stroke="#d0d7de"/><path d="M14.5,1.25 H745.5" stroke="url(#ls)" stroke-width="1.5"/><text x="28" y="50" font-size="24" font-weight="700" fill="#1f2328" text-anchor="start">How I build</text><text x="178.595" y="50" font-size="16" font-weight="400" fill="#59636e" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">the 4D loop</text><text x="28" y="92" font-size="13" font-weight="500" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">me: direction and sign-off</text><rect x="18" y="218" width="724" height="116" rx="10" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5 5"/><text x="28" y="240" font-size="13" font-weight="500" fill="#0a7c86" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">agents: inside agreed limits</text><rect x="28.0" y="106" width="167.0" height="42" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.4"/><text x="40" y="133" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">1</text><text x="60" y="133" font-size="17" font-weight="650" fill="#1f2328" text-anchor="start">Delegation</text><text x="30" y="174" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">Decide what agents</text><text x="30" y="194" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">may touch.</text><text x="30" y="266" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">Get a brief, short</text><text x="30" y="286" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">leases and hooks.</text><path d="M196.0,127 H206.0" stroke="#9a6700" stroke-width="1.6" marker-end="url(#ar)"/><rect x="207.0" y="106" width="167.0" height="42" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.4"/><text x="219" y="133" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">2</text><text x="239" y="133" font-size="17" font-weight="650" fill="#1f2328" text-anchor="start">Description</text><text x="209" y="174" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">Write the plan, rules</text><text x="209" y="194" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">and checks.</text><text x="209" y="266" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">Write the code and the</text><text x="209" y="286" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">tests.</text><path d="M375.0,127 H385.0" stroke="#9a6700" stroke-width="1.6" marker-end="url(#ar)"/><rect x="386.0" y="106" width="167.0" height="42" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.4"/><text x="398" y="133" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">3</text><text x="418" y="133" font-size="17" font-weight="650" fill="#1f2328" text-anchor="start">Discernment</text><text x="388" y="174" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">Read the findings and</text><text x="388" y="194" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">decide.</text><text x="388" y="266" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">Run tests,</text><text x="388" y="286" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">benchmarks, a second</text><text x="388" y="306" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">review.</text><path d="M554.0,127 H564.0" stroke="#9a6700" stroke-width="1.6" marker-end="url(#ar)"/><rect x="565.0" y="106" width="167.0" height="42" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.4"/><text x="577" y="133" font-size="16" font-weight="700" fill="#9a6700" text-anchor="start" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">4</text><text x="597" y="133" font-size="17" font-weight="650" fill="#1f2328" text-anchor="start">Diligence</text><text x="567" y="174" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">Approve, and date</text><text x="567" y="194" font-size="15" font-weight="400" fill="#1f2328" text-anchor="start">every number.</text><text x="567" y="266" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">Pass the gates; limits</text><text x="567" y="286" font-size="15" font-weight="400" fill="#424a53" text-anchor="start">go in writing.</text><path d="M648.5,334 V356 H111.5 V340" fill="none" stroke="#9a6700" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#ar)"/><text x="380" y="378" font-size="14" font-weight="400" fill="#59636e" text-anchor="middle">the next change starts from what this one taught</text></svg>
