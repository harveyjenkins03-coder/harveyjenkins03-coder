<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Deterministic systems</title><desc id="d">Deterministic systems. A Rust engine of 15 crates that steps 60 times a second in fixed-point maths. The server leads, clients predict and correct over UDP, and Windows and Linux (WSL2) agree bit for bit. Tools: rust, wgpu, netcode, cargo-fuzz.</desc><rect width="420" height="270" fill="#0d1117"/><rect x="0.5" y="0.5" width="419" height="269" rx="12" fill="#161b22" stroke="#30363d"/><path d="M12.5,0.5 H407.5" stroke="#e09f3e" stroke-width="3" stroke-linecap="round"/><rect x="24" y="24" width="40" height="40" rx="9" fill="#0d1117" stroke="#e09f3e" stroke-width="1.5"/><path d="M32,51 H38 V43 H44 V37 H50 V46 H56" fill="none" stroke="#e09f3e" stroke-width="2" stroke-linejoin="round"/><text x="78" y="50" font-size="19" font-weight="600" fill="#e6edf3" text-anchor="start">Deterministic systems</text><text x="24" y="98" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">A Rust engine of 15 crates that steps 60 times a</text><text x="24" y="120" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">second in fixed-point maths. The server leads,</text><text x="24" y="142" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">clients predict and correct over UDP, and Windows</text><text x="24" y="164" font-size="15" font-weight="400" fill="#9198a1" text-anchor="start">and Linux (WSL2) agree bit for bit.</text><rect x="24" y="226" width="48.6" height="24" rx="12" fill="none" stroke="#e09f3e" stroke-opacity="0.7"/><text x="48.31" y="242.5" font-size="12.5" font-weight="400" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">rust</text><rect x="80.62" y="226" width="48.6" height="24" rx="12" fill="none" stroke="#e09f3e" stroke-opacity="0.7"/><text x="104.93" y="242.5" font-size="12.5" font-weight="400" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">wgpu</text><rect x="137.24" y="226" width="70.1" height="24" rx="12" fill="none" stroke="#e09f3e" stroke-opacity="0.7"/><text x="172.283" y="242.5" font-size="12.5" font-weight="400" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">netcode</text><rect x="215.32500000000002" y="226" width="91.5" height="24" rx="12" fill="none" stroke="#e09f3e" stroke-opacity="0.7"/><text x="261.1" y="242.5" font-size="12.5" font-weight="400" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">cargo-fuzz</text></svg>
