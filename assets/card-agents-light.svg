<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 270" width="420" height="270" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">AI agent tooling</title><desc id="d">AI agent tooling. Plans that replay in a clean worktree, an SQLite memory with trust levels and an injection screen, and a gate that leaves the last step of a new agent profile to a person. Tools: python, sqlite fts5, claude code.</desc><rect width="420" height="270" fill="#ffffff"/><rect x="0.5" y="0.5" width="419" height="269" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><path d="M12.5,0.5 H407.5" stroke="#0a7c86" stroke-width="3" stroke-linecap="round"/><rect x="24" y="24" width="40" height="40" rx="9" fill="#ffffff" stroke="#0a7c86" stroke-width="1.5"/><path d="M36,51 L44,37 L52,51 Z" fill="none" stroke="#0a7c86" stroke-width="1.6"/><circle cx="36" cy="51" r="3.6" fill="#0a7c86"/><circle cx="44" cy="37" r="3.6" fill="#0a7c86"/><circle cx="52" cy="51" r="3.6" fill="#0a7c86"/><text x="78" y="50" font-size="19" font-weight="600" fill="#1f2328" text-anchor="start">AI agent tooling</text><text x="24" y="98" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">Plans that replay in a clean worktree, an SQLite</text><text x="24" y="120" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">memory with trust levels and an injection screen,</text><text x="24" y="142" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">and a gate that leaves the last step of a new agent</text><text x="24" y="164" font-size="15" font-weight="400" fill="#59636e" text-anchor="start">profile to a person.</text><rect x="24" y="226" width="62.9" height="24" rx="12" fill="none" stroke="#0a7c86" stroke-opacity="0.7"/><text x="55.465" y="242.5" font-size="12.5" font-weight="400" fill="#0a7c86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">python</text><rect x="94.93" y="226" width="98.7" height="24" rx="12" fill="none" stroke="#0a7c86" stroke-opacity="0.7"/><text x="144.282" y="242.5" font-size="12.5" font-weight="400" fill="#0a7c86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">sqlite fts5</text><rect x="201.635" y="226" width="98.7" height="24" rx="12" fill="none" stroke="#0a7c86" stroke-opacity="0.7"/><text x="250.987" y="242.5" font-size="12.5" font-weight="400" fill="#0a7c86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">claude code</text></svg>
