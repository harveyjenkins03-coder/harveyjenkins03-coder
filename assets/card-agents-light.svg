<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 360" width="370" height="360" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Agent architecture and 4D orchestration</title><desc id="d">Agent architecture and 4D orchestration. Plans that replay in a clean worktree, an SQLite FTS5 memory with trust levels, a human gate for new agent profiles, and a Claude Code plugin for designing websites. Tools: python, sqlite, claude code.</desc><defs><linearGradient id="c2f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="c2s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c959f" stop-opacity="0"/><stop offset="0.5" stop-color="#8c959f" stop-opacity="0.35"/><stop offset="1" stop-color="#8c959f" stop-opacity="0"/></linearGradient><radialGradient id="c2g" cx="12%" cy="0%" r="75%"><stop offset="0" stop-color="#0a7c86" stop-opacity="0.13"/><stop offset="1" stop-color="#0a7c86" stop-opacity="0"/></radialGradient></defs><rect width="370" height="360" fill="#ffffff"/><rect x="0.5" y="0.5" width="369" height="359" rx="14" fill="url(#c2f)" stroke="#d0d7de"/><path d="M14.5,1.25 H355.5" stroke="url(#c2s)" stroke-width="1.5"/><rect x="0.5" y="0.5" width="369" height="359" rx="14" fill="url(#c2g)"/><circle cx="50" cy="52" r="26" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><path d="M50,40.48 L38.48,60.64 L61.52,60.64 Z" fill="none" stroke="#0a7c86" stroke-width="1.872" stroke-linejoin="round"/><circle cx="50" cy="40.48" r="4.68" fill="#0a7c86"/><circle cx="38.48" cy="60.64" r="4.68" fill="#0a7c86"/><circle cx="61.52" cy="60.64" r="4.68" fill="#0a7c86"/><text x="24" y="112" font-size="21" font-weight="650" fill="#1f2328" text-anchor="start">Agent architecture and 4D</text><text x="24" y="139" font-size="21" font-weight="650" fill="#1f2328" text-anchor="start">orchestration</text><text x="24