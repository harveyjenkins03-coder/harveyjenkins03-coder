<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 324" width="412" height="324" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Agents and 4D orchestration</title><desc id="d">Agents and 4D orchestration. Replayable agent plans and an SQLite FTS5 memory with trust levels, standard library only. A dated note covers a month of how I actually run agents, mistakes included. Tools: python, sqlite, claude code.</desc><defs><linearGradient id="c2f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f8fa"/><stop offset="1" stop-color="#ffffff"/></linearGradient><linearGradient id="c2s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8c959f" stop-opacity="0"/><stop offset="0.5" stop-color="#8c959f" stop-opacity="0.35"/><stop offset="1" stop-color="#8c959f" stop-opacity="0"/></linearGradient><radialGradient id="c2g" cx="12%" cy="0%" r="75%"><stop offset="0" stop-color="#0a7c86" stop-opacity="0.13"/><stop offset="1" stop-color="#0a7c86" stop-opacity="0"/></radialGradient></defs><rect width="412" height="324" fill="#ffffff"/><g transform="translate(4,4)"><rect x="0.5" y="0.5" width="403" height="315" rx="14" fill="url(#c2f)" stroke="#d0d7de"/><path d="M14.5,1.25 H389.5" stroke="url(#c2s)" stroke-width="1.5"/><rect x="0.5" y="0.5" width="403" height="315" rx="14" fill="url(#c2g)"/><circle cx="50" cy="52" r="26" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/><path d="M50,40.48 L38.48,60.64 L61.52,60.64 Z" fill="none" stroke="#0a7c86" stroke-width="1.872" stroke-linejoin="round"/><circle cx="50" cy="40.48" r="4.68" fill="#0a7c86"/><circle cx="38.48" cy="60.64" r="4.68" fill="#0a7c86"/><circle cx="61.52" cy="60.64" r="4.68" fill="#0a7c86"/><text x="24" y="112" font-size="21" font-weight="650" fill="#1f2328" text-anchor="start">Agents and 4D orchestration</text><text x="24" y="145" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">Replayable agent plans and an SQLite FTS5</text><text x="24" y="168" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">memory with trust levels, standard library only.</text><text x="24" y="191" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">A dated note covers a month of how I actually</text><text x="24" y="214" font-size="16" font-weight="400" fill="#424a53" text-anchor="start">run agents, mistakes included.</text><rect x="24.0" y="270" width="68.1" height="26" rx="13" fill="#ffffff" stroke="#0a7c86" stroke-opacity="0.75"/><text x="58.055" y="287.5" font-size="13" font-weight="500" fill="#0a7c86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">python</text><rect x="100.1" y="270" width="68.1" height="26" rx="13" fill="#ffffff" stroke="#0a7c86" stroke-opacity="0.75"/><text x="134.165" y="287.5" font-size="13" font-weight="500" fill="#0a7c86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">sqlite</text><rect x="176.2" y="270" width="106.5" height="26" rx="13" fill="#ffffff" stroke="#0a7c86" stroke-opacity="0.75"/><text x="229.488" y="287.5" font-size="13" font-weight="500" fill="#0a7c86" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">claude code</text></g></svg>
