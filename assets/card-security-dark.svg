<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 412 324" width="412" height="324" role="img" aria-labelledby="t d" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"><title id="t">Security and AI guardrails</title><desc id="d">Security and AI guardrails. An MCP broker that lets agents call APIs with keys they never see, and a scope guard for authorised testing that fails closed. A leak scanner reads every git object before I push. Tools: mcp, hmac, git hooks.</desc><defs><linearGradient id="c0f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2230"/><stop offset="1" stop-color="#161b22"/></linearGradient><linearGradient id="c0s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><radialGradient id="c0g" cx="12%" cy="0%" r="75%"><stop offset="0" stop-color="#e09f3e" stop-opacity="0.13"/><stop offset="1" stop-color="#e09f3e" stop-opacity="0"/></radialGradient></defs><rect width="412" height="324" fill="#0d1117"/><g transform="translate(4,4)"><rect x="0.5" y="0.5" width="403" height="315" rx="14" fill="url(#c0f)" stroke="#30363d"/><path d="M14.5,1.25 H389.5" stroke="url(#c0s)" stroke-width="1.5"/><rect x="0.5" y="0.5" width="403" height="315" rx="14" fill="url(#c0g)"/><circle cx="50" cy="52" r="26" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/><path d="M50,37.6 L61.52,42.64 V52.72 C61.52,60.64 55.76,64.96 50,67.84 C44.24,64.96 38.48,60.64 38.48,52.72 V42.64 Z" fill="none" stroke="#e09f3e" stroke-width="2.016" stroke-linejoin="round"/><circle cx="50" cy="51.28" r="2.736" fill="#e09f3e"/><path d="M50,53.44 V58.48" stroke="#e09f3e" stroke-width="2.304" stroke-linecap="round"/><text x="24" y="112" font-size="21" font-weight="650" fill="#f0f6fc" text-anchor="start">Security and AI guardrails</text><text x="24" y="145" font-size="16" font-weight="400" fill="#c9d1d9" text-anchor="start">An MCP broker that lets agents call APIs with</text><text x="24" y="168" font-size="16" font-weight="400" fill="#c9d1d9" text-anchor="start">keys they never see, and a scope guard for</text><text x="24" y="191" font-size="16" font-weight="400" fill="#c9d1d9" text-anchor="start">authorised testing that fails closed. A leak</text><text x="24" y="214" font-size="16" font-weight="400" fill="#c9d1d9" text-anchor="start">scanner reads every git object before I push.</text><rect x="24.0" y="270" width="45.1" height="26" rx="13" fill="#0d1117" stroke="#e09f3e" stroke-opacity="0.75"/><text x="46.5275" y="287.5" font-size="13" font-weight="500" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">mcp</text><rect x="77.1" y="270" width="52.7" height="26" rx="13" fill="#0d1117" stroke="#e09f3e" stroke-opacity="0.75"/><text x="103.425" y="287.5" font-size="13" font-weight="500" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">hmac</text><rect x="137.8" y="270" width="91.2" height="26" rx="13" fill="#0d1117" stroke="#e09f3e" stroke-opacity="0.75"/><text x="183.378" y="287.5" font-size="13" font-weight="500" fill="#e09f3e" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Mono', Consolas, monospace">git hooks</text></g></svg>
